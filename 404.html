<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <script>
        // Automatic extensionless URL handler for GitHub Pages
        (function() {
            var pathname = window.location.pathname;
            // If it already ends with .html, the file genuinely does not exist - do not loop
            if (pathname.endsWith('.html')) {
                return;
            }
            var segments = pathname.split('/').filter(Boolean);
            var lastSegment = segments[segments.length - 1] || '';
            // If the last segment has no extension, try loading the corresponding .html file
            if (lastSegment && !lastSegment.includes('.')) {
                var target = pathname.replace(/\/$/, '') + '.html' + window.location.search + window.location.hash;
                window.location.replace(target);
            }
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0c10;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 30px;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            color: #10b981;
        }
        h2 {
            font-size: 1.5rem;
            margin: 10px 0 20px;
            font-weight: 500;
        }
        p {
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            background: #10b981;
            color: #fff;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        a:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
