<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCHL Payment Verify Test</title>
<script>
if (window.location.pathname.endsWith('.html')) {
    var cleanPath = window.location.pathname.replace(/\.html$/, '');
    window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
}
</script>
<style>
body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 600px; margin: auto; }
.form-group { margin-bottom: 15px; }
label { display: block; font-weight: bold; }
input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
button { background: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
#response { background: #f4f4f4; padding: 15px; margin-top: 20px; border: 1px solid #ddd; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>

<h2>Verify Payment Status</h2>
<p><small>Note: Enter either <b>Transaction ID</b> or <b>Client Request ID</b> (at least one is mandatory).<br>Direct browser requests may fail if CORS/IP restrictions are enabled by NCHL.</small></p>


<div class="form-group">
<label>Transaction ID:</label>
<input type="text" id="txnId" placeholder="e.g. 0cc5b1a39f3c4cad864bc1c6a524534f">
</div>

<div class="form-group">
<label>Client Request ID (Optional):</label>
<input type="text" id="clientRequestId" placeholder="e.g. 20260903034003328677">
</div>

<button onclick="verifyPayment()">Verify Payment</button>

<h3>Response:</h3>
<div id="response">Waiting for request...</div>

<script>
async function verifyPayment() {
    const baseURL = "https://ecom-getpay.nchl.com.np/ecom-web-checkout";
    const txnId = document.getElementById('txnId').value.trim();
    const clientRequestId = document.getElementById('clientRequestId').value.trim();
    const responseDiv = document.getElementById('response');

    responseDiv.innerText = "Sending request...";

    const payload = {};
    if (txnId) {
        payload.transactionId = txnId;
    }
    if (clientRequestId) {
        payload.clientRequestId = clientRequestId;
    }

    if (!txnId && !clientRequestId) {
        responseDiv.innerText = "Please enter either a Transaction ID or a Client Request ID.";
        return;
    }

try {
const response = await fetch(`${baseURL}/v1/secure-merchant/transactions/transaction-statement`, {
method: 'POST',
headers: {
'Content-Type': 'application/json',
// Note: Browsers usually block setting 'User-Agent' for security
},
body: JSON.stringify(payload)
});

const data = await response.json();
responseDiv.innerText = JSON.stringify(data, null, 4);
} catch (error) {
responseDiv.innerText = "Error: " + error.message + 
"\n\n(This is likely a CORS block or the 403 Forbidden issue seen in your logs.)";
}
}
</script>
</body>
</html>
