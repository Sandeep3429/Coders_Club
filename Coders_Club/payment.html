<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Secure Checkout | getPay</title>

  <!-- Prevent clickjacking & keep clean URL -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
    if (window.location.pathname.endsWith('.html')) {
      var cleanPath = window.location.pathname.replace(/\.html$/, '');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>

  <!-- GetPay bundle (deferred load) -->
  <script defer src="https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 30px 16px;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
    }
    .checkout-wrapper {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      padding: 24px;
    }
    #checkout {
      width: 100% !important;
      position: relative;
    }
    #checkout iframe:not([src*="cybersource.com"]) {
      width: 100% !important;
      min-width: 100% !important;
      min-height: 520px !important;
      border: none !important;
      display: block !important;
      background: #ffffff !important;
    }
    #checkout iframe {
      border: none !important;
    }
    #Cardinal-CCA-IFrame,
    iframe[id*="Cardinal"],
    iframe[name*="Cardinal"] {
      width: 100% !important;
      min-height: 600px !important;
      border: none !important;
      z-index: 9999 !important;
    }
    #status-message {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="checkout-wrapper">
    <div id="error-display" class="error-box"></div>
    <div id="checkout"></div>
  </div>

  <!-- Processing overlay -->
  <div id="status-message">
    <div class="spinner"></div>
    <h3 style="margin: 0; color: #0f172a; font-weight: 700;">Processing Payment</h3>
    <p style="margin: 0; color: #64748b; font-size: 14px;">Please wait while we verify your transaction…</p>
  </div>

  <script>
    const PAP_INFO = "eyJpbnN0aXR1dGlvbklkIjoiMTIyIiwibWlkIjoiMTIzMTIzNDUxNzcwOTg2IiwidGlkIjoiMTIzNTg3NjIifQ==";
    const OPR_KEY = "4fa4c6b9-3f91-43e5-9b4f-319f68187ba5";
    const VERIFY_URL = "https://uat-bank-getpay.nchl.com.np/ecom-web-checkout/v1/secure-merchant/transactions/merchant-status";
    const WEBSITE_DOMAIN = "https://sandeepkumarjha.com.np";

    function showError(msg) {
      const el = document.getElementById("error-display");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("checkout").style.display = "none";
      document.getElementById("status-message").style.display = "none";
    }

    async function verifyAndRedirect(txnId, expectedAmount) {
      document.getElementById("checkout").style.display = "none";
      document.getElementById("status-message").style.display = "flex";

      try {
        const res = await fetch(VERIFY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: txnId }),
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        const result = await res.json();
        const data = result.data || result;

        if (!data || data.status !== "SUCCESS") {
          const reason = data?.remarks || "Transaction failed";
          window.location.href = `fail.html?reason=${encodeURIComponent(reason)}`;
          return;
        }

        const received = Number(data.amount);
        if (Math.abs(received - expectedAmount) > 0.05) {
          window.location.href = `fail.html?reason=amount`;
          return;
        }

        window.location.href = `success.html?verified=true&txid=${txnId}`;
      } catch (err) {
        console.error(err);
        window.location.href = `fail.html?reason=verification`;
      }
    }

    window.addEventListener("load", () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const courseCatalog = {
        "oracle-plsql": {
          name: "Mastering Oracle PL/SQL for Financial Systems",
          price: 6500.00,
          imageUrl: "https://sandeepkumarjha.com.np/projects/codersclub/img/python.jpg"
        },
        "banking-etl": {
          name: "Banking Data Reconciliation Pipelines",
          price: 10500.00,
          imageUrl: "https://sandeepkumarjha.com.np/projects/codersclub/img/feature.jpg"
        },
        "java-mastery": {
          name: "Java Mastery Course",
          price: 4500.55,
          imageUrl: "https://sandeepkumarjha.com.np/projects/codersclub/img/java.png"
        }
      };

      const courseId = params.get("courseId") || localStorage.getItem("getpay_expected_course") || "oracle-plsql";
      const courseData = courseCatalog[courseId] || courseCatalog["oracle-plsql"];
      const expectedAmount = parseFloat(params.get("amount")) || parseFloat(localStorage.getItem("getpay_expected_amount")) || courseData.price;
      const userEmail = params.get("email") || "customer@example.com";

      if (token) {
        try {
          const payload = JSON.parse(atob(token));
          const txnId = payload.id || payload.transactionId || payload.txnId;
          if (txnId) {
            verifyAndRedirect(txnId, expectedAmount);
            return;
          }
        } catch (e) {
          showError("Invalid response from bank");
          return;
        }
      }

      function init() {
        if (typeof GetPay === "undefined" && typeof getpay === "undefined") {
          setTimeout(init, 400);
          return;
        }

        localStorage.setItem("getpay_expected_amount", expectedAmount);
        localStorage.setItem("getpay_expected_course", courseId);

        // Order UI block
        const orderInformationUI = localStorage.getItem("getpay_order_ui") || `
          <div style="font-family:Arial;">
            <h3>Order Information</h3>
            <div class="item" style="margin-bottom: 20px;">
              <div class="item" style="display: flex; align-items: center;">
                <img style="max-width: 50px; max-height: 50px; width: 50px; height: 50px; object-fit: cover; border-radius: 6px; margin-right: 10px;" src="${courseData.imageUrl}" alt="image">
                <div>
                  <div style="font-weight: 600; color: #0f172a;">${courseData.name}</div>
                  <div style="color: #2563eb; font-weight: 700; margin-top: 4px;">NPR ${expectedAmount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                </div>
              </div>
            </div>
          </div>
        `;

        const options = {
          userInfo: {
            name: "Sandeep Kumar Jha",
            email: userEmail,
            state: "Bagmati",
            country: "Nepal",
            zipcode: "44600",
            city: "Kathmandu",
            address: "Maitidevi"
          },
          clientRequestId: "ORD-" + Date.now(),
          papInfo: PAP_INFO,
          oprKey: OPR_KEY,
          insKey: "",
          websiteDomain: WEBSITE_DOMAIN,
          price: expectedAmount,
          businessName: courseData.name,
          imageUrl: courseData.imageUrl,
          orderInformationUI: orderInformationUI,
          currency: "NPR",
          prefill: { name: true, email: true, state: true, city: true, address: true },
          themeColor: "#5662FF",
          baseUrl: "https://uat-bank-getpay.nchl.com.np/ecom-web-checkout/v1/secure-merchant/transactions",
          callbackUrl: {
            successUrl: `${window.location.origin}${window.location.pathname}`,
            failUrl: `${window.location.origin}${window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'))}/fail.html`
          },
          onSuccess: (res) => {
            const tid = res.transactionId || res.id || res.txnId;
            if (tid) verifyAndRedirect(tid, expectedAmount);
          },
          onError: (err) => {
            console.warn(err);
            showError("Payment failed. Please try again.");
          },
        };

        try {
          if (window.getpay && typeof window.getpay.initialize === 'function') {
            window.getpay.initialize(options);
          } else {
            const gp = new GetPay(options);
            if (typeof gp.initialize === 'function') {
              gp.initialize(options);
            } else if (typeof gp.init === 'function') {
              gp.init(options);
            }
          }
        } catch (e) {
          showError("Payment initialization failed");
          console.error(e);
        }
      }

      init();
    });
  </script>
</body>
</html>
