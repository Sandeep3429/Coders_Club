<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed</title>

  <!-- Anti-clickjacking per GetPay doc Page 3 -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
  </script>

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/status.css">
</head>
<body>

  <div class="status-card fail">
    <div class="status-icon">❌</div>
    <h2 class="status-title">Payment Failed</h2>
    <p class="status-desc">We could not process your transaction.</p>
    <p class="reason" id="failReason">Reason: Transaction was declined or cancelled.</p>
    <a href="getpay.html" class="btn-action fail">Try Again</a>
  </div>

  <!-- Segregated Failure Logic -->
  <script src="js/fail.js"></script>
</body>
</html>
