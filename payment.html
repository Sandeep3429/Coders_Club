<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
  <title>Payment Checkout | getPay</title>

  <!-- Anti-clickjacking per GetPay doc -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
  </script>

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/payment.css">

  <!-- NCHL GetPay SDK Bundle -->
  <script defer src="https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js"></script>
</head>
<body>

  <main class="payment-page-container">
    <!-- GetPay Checkout Mount Element per documentation -->
    <div id="checkout">
      <div id="checkout-loader">
        <div class="checkout-spinner"></div>
        <div class="checkout-loader-text">Loading GetPay Secure Checkout…</div>
      </div>
    </div>
    <div id="error-box"></div>
  </main>

  <!-- Segregated Configuration & Payment Logic -->
  <script src="js/getpay-config.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
