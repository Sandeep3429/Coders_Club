<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Payment Failed</title>

  <!-- Anti-clickjacking per GetPay doc Page 3 -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
  </script>

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/status.css">
</head>
<body>

  <!-- AFT: Transfer Failed block -->
  <div id="aft-fail-block" class="status-card fail" style="display:none;">
    <div class="status-icon">❌</div>
    <h2 class="status-title">Transfer Failed</h2>
    <p class="status-desc">We could not process your account fund transfer.</p>
    <p class="reason" id="aft-failReason">Reason: The transfer could not be completed.</p>
    <a href="aft.html" class="btn-action fail">Retry Transfer</a>
    <a href="https://sandeepkumarjha.com.np" class="btn-action" style="margin-top:8px;background:#374151;">Go to Homepage</a>
  </div>

  <!-- ECOM: Payment Failed block (default) -->
  <div id="ecom-fail-block" class="status-card fail">
    <div class="status-icon">❌</div>
    <h2 class="status-title">Payment Failed</h2>
    <p class="status-desc">We could not process your transaction.</p>
    <p class="reason" id="failReason">Reason: Transaction was declined or cancelled.</p>
    <a href="getpay.html" class="btn-action fail">Try Again</a>
  </div>

  <!-- Branched controller -->
  <script>
    (function () {
      const isAft = new URLSearchParams(window.location.search).get('flow') === 'aft';
      if (isAft) {
        document.getElementById('ecom-fail-block').style.display = 'none';
        document.getElementById('aft-fail-block').style.display  = 'block';
        var s = document.createElement('script');
        s.src = 'js/aft-fail.js';
        document.body.appendChild(s);
      } else {
        var s = document.createElement('script');
        s.src = 'js/fail.js';
        document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
