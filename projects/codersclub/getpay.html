<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
  <title>Checkout – GetPay Payment</title>

  <!-- External Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/getpay.css">

  <!-- NCHL GetPay SDK Bundle -->
  <script defer src="https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="header-title">Java Mastery Course</h1>
      <p id="header-subtitle">Learn Java from scratch to advanced level</p>
    </div>

    <div class="content">
      <div class="course-card">
        <img id="course-img" src="img/java.png" alt="Course Image">
        <div class="course-info">
          <h3 id="course-name">JAVA FULL COURSE</h3>
          <div class="price" id="course-price">Rs 4,500.55</div>
        </div>
      </div>

      <!-- Hidden checkout container per GetPay specification -->
      <div id="checkout" hidden></div>

      <button id="checkout-btn" class="btn-pay">
        <i class="fas fa-lock"></i>
        <span id="btn-text">Proceed to Pay Securely</span>
      </button>

      <p class="secure-note">
        <i class="fas fa-shield-alt"></i>
        Secured by NCHL GetPay • 256-bit SSL Encryption
      </p>

      <div id="integration-status">Waiting for checkout…</div>
    </div>
  </div>

  <!-- Segregated Configuration & Checkout Logic -->
  <script src="js/getpay-config.js"></script>
  <script src="js/getpay-checkout.js"></script>
</body>
</html>
