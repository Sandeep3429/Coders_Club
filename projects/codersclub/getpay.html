<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>GetPay – Select Transaction Type</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Anti-Clickjacking -->
  <script>if (window.top !== window.self) window.top.location = window.self.location.href;</script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Payment Gateway Preconnections -->
  <link rel="preconnect" href="https://minio-getpay.nchl.com.np">
  <link rel="dns-prefetch" href="https://minio-getpay.nchl.com.np">
  <link rel="preconnect" href="https://uat-bank-getpay.nchl.com.np">
  <link rel="dns-prefetch" href="https://uat-bank-getpay.nchl.com.np">
  <link rel="preconnect" href="https://testflex.cybersource.com">
  <link rel="dns-prefetch" href="https://testflex.cybersource.com">

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 50%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
      color: #0f172a;
    }

    /* ── Page Container ── */
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Heading block ── */
    .heading {
      text-align: center;
      margin-bottom: 36px;
    }

    .heading h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .heading p {
      font-size: 1rem;
      color: #64748b;
      font-weight: 500;
    }

    /* ── Cards grid ── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 580px) {
      .cards { grid-template-columns: 1fr; }
    }

    /* ── Individual card ── */
    .txn-card {
      position: relative;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 26px 30px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      user-select: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 24px -5px rgba(0, 0, 0, 0.04);
      -webkit-tap-highlight-color: transparent;
    }

    /* ECOM hover & active */
    .txn-card.ecom:hover,
    .txn-card.ecom:focus-visible {
      border-color: #6366f1;
      transform: translateY(-4px);
      box-shadow: 0 20px 35px -10px rgba(99, 102, 241, 0.2), 0 0 0 1px rgba(99, 102, 241, 0.15);
    }

    .txn-card.ecom:active {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.2);
    }

    /* AFT hover & active */
    .txn-card.aft:hover,
    .txn-card.aft:focus-visible {
      border-color: #f59e0b;
      transform: translateY(-4px);
      box-shadow: 0 20px 35px -10px rgba(245, 158, 11, 0.2), 0 0 0 1px rgba(245, 158, 11, 0.15);
    }

    .txn-card.aft:active {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px rgba(245, 158, 11, 0.2);
    }

    /* ── Icon circle ── */
    .card-icon {
      width: 68px; height: 68px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .txn-card:hover .card-icon { transform: scale(1.08); }

    .ecom .card-icon {
      background: #eef2ff;
      color: #4f46e5;
    }

    .aft .card-icon {
      background: #fffbeb;
      color: #d97706;
    }

    /* ── Card text ── */
    .card-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
    }

    /* ── Arrow badge ── */
    .card-arrow {
      margin-top: 10px;
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    .ecom .card-arrow  { color: #64748b; }
    .aft  .card-arrow  { color: #64748b; }

    .txn-card.ecom:hover .card-arrow {
      background: #eef2ff;
      color: #4f46e5;
      transform: translateX(4px);
    }

    .txn-card.aft:hover .card-arrow {
      background: #fffbeb;
      color: #d97706;
      transform: translateX(4px);
    }

    /* ── Badge ── */
    .card-badge {
      position: absolute;
      top: 14px; right: 14px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .ecom .card-badge { background: #eef2ff; color: #4338ca; border: 1px solid #e0e7ff; }
    .aft  .card-badge { background: #fffbeb; color: #b45309; border: 1px solid #fef3c7; }

    /* ── Secure footer ── */
    .secure-bar {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
    }

    .secure-bar i { color: #10b981; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Heading -->
    <div class="heading">
      <h1>Select Transaction Type</h1>
      <p>Choose how you'd like to proceed</p>
    </div>

    <!-- Transaction Type Cards -->
    <div class="cards">

      <!-- ECOM Purchase -->
      <a class="txn-card ecom" href="payment.html?courseId=oracle-plsql" id="ecom-card">
        <span class="card-badge">ECOM</span>
        <div class="card-icon">
          <i class="fas fa-shopping-cart"></i>
        </div>
        <div>
          <div class="card-label">ECOM Purchase</div>
          <div class="card-desc">Course enrollment &amp; secure card checkout</div>
        </div>
        <div class="card-arrow">
          <i class="fas fa-arrow-right"></i>
        </div>
      </a>

      <!-- AFT -->
      <a class="txn-card aft" href="aft.html" id="aft-card">
        <span class="card-badge">AFT</span>
        <div class="card-icon">
          <i class="fas fa-paper-plane"></i>
        </div>
        <div>
          <div class="card-label">Account Fund Transfer</div>
          <div class="card-desc">Send funds directly to a recipient account</div>
        </div>
        <div class="card-arrow">
          <i class="fas fa-arrow-right"></i>
        </div>
      </a>

    </div>

    <!-- Secure note -->
    <div class="secure-bar">
      <i class="fas fa-shield-halved"></i>
      Secured by NCHL GetPay &middot; 256-bit SSL Encryption
    </div>
  </div>

  <!-- Hidden checkout anchor for SDK bundle initialization on Page 1 -->
  <div id="checkout" hidden style="display:none;"></div>

  <script src="js/getpay-config.js"></script>
  <script src="https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js" defer></script>

  <script>
    (function () {
      const ecomCard = document.getElementById("ecom-card");
      if (!ecomCard) return;

      ecomCard.addEventListener("click", function (e) {
        e.preventDefault();

        const desc = ecomCard.querySelector(".card-desc");
        const arrow = ecomCard.querySelector(".card-arrow");
        if (desc) desc.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Initializing secure checkout…';
        if (arrow) arrow.style.opacity = "0.5";
        ecomCard.style.pointerEvents = "none";

        const config = window.GetPayConfig;
        const courseId = "oracle-plsql";
        const courseData = config ? config.getCourseData(courseId) : { price: 6500.00, name: "Oracle PL/SQL", imageUrl: "img/python.jpg" };
        const totalAmount = courseData.price;
        const feeRate = 0.035;
        const feeAmount = parseFloat((totalAmount * feeRate).toFixed(2));
        const netAmount = parseFloat((totalAmount - feeAmount).toFixed(2));

        // Persist expected course & amount breakdown for receipts
        localStorage.setItem("getpay_expected_course", courseId);
        localStorage.setItem("getpay_base_amount", netAmount);
        localStorage.setItem("getpay_fee_amount", feeAmount.toFixed(2));
        localStorage.setItem("getpay_expected_amount", totalAmount);

        const paymentComment = "Added 3.5% surcharge and Powered by Laxmi Sunrise Bank Limited";
        const orderInformationUI = config ? config.createOrderInformationUI(courseData, totalAmount, paymentComment) : "";
        localStorage.setItem("getpay_order_ui", orderInformationUI);

        const feeTag = feeAmount.toFixed(2).replace(".", "_");
        const clientRequestId = `ORD-${Date.now()}-F35_${feeTag}`;
        localStorage.setItem("getpay_client_request_id", clientRequestId);
        localStorage.setItem("getpay_payment_comment", paymentComment);

        const callbacks = config ? config.getCallbackUrls() : { successUrl: "", failUrl: "" };
        const verifiedImageUrl = config ? config.getImageUrl(courseData.imageUrl) : "";
        const targetUrl = "payment.html?courseId=" + encodeURIComponent(courseId);

        let navigated = false;
        function goPayment() {
          if (navigated) return;
          navigated = true;
          window.location.href = targetUrl;
        }

        // Safety fallback navigation: if SDK takes > 2s, proceed anyway
        const safetyTimer = setTimeout(goPayment, 2200);

        // Official Page 1 Flow: Pre-initialize session into sessionStorage before payment.html opens
        if (typeof window.GetPay === "function" && config) {
          try {
            const options = {
              userInfo: { name: "", email: "", state: "", country: "", zipcode: "", city: "", address: "" },
              clientRequestId: clientRequestId,
              clientRemarks: paymentComment,
              papInfo: config.PAP_INFO,
              oprKey: config.OPR_KEY,
              insKey: config.INS_KEY,
              websiteDomain: config.WEBSITE_DOMAIN,
              allowBillingAddressFields: true,
              price: Number(totalAmount),
              businessName: courseData.name,
              imageUrl: verifiedImageUrl,
              orderInformationUI: orderInformationUI,
              currency: "NPR",
              prefill: { name: true, email: true, state: true, city: true, address: true, zipcode: true, country: true },
              disableFields: { address: false, state: false },
              themeColor: "#5662FF",
              baseUrl: config.BASE_URL,
              callbackUrl: { successUrl: callbacks.successUrl, failUrl: callbacks.failUrl },
              onSuccess: function (res) {
                clearTimeout(safetyTimer);
                console.log("GetPay Page 1 session initialized:", res);
                goPayment();
              },
              onError: function (err) {
                clearTimeout(safetyTimer);
                console.warn("GetPay Page 1 session note:", err);
                goPayment();
              }
            };

            const gp = new window.GetPay(options, config.BASE_URL);
            if (typeof gp.initialize === "function") {
              gp.initialize();
            } else {
              goPayment();
            }
          } catch (err) {
            goPayment();
          }
        } else {
          goPayment();
        }
      });
    })();
  </script>
</body>
</html>
