<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
  <title>Payment Checkout | getPay</title>
  <script defer src="https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #checkout {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px;
      min-height: 400px;
    }
  </style>
</head>

<body>
  <!-- create a div element with id checkout -->
  <div id="checkout"></div>

  <script>
    const PAP_INFO = "eyJpbnN0aXR1dGlvbklkIjoiMTIyIiwibWlkIjoiMTIzMTIzNDUxNzcwOTg2IiwidGlkIjoiMTIzNTg3NjIifQ==";
    const OPR_KEY = "4fa4c6b9-3f91-43e5-9b4f-319f68187ba5";
    const BASE_URL = "https://uat-bank-getpay.nchl.com.np/ecom-web-checkout/v1/secure-merchant/transactions";
    const WEBSITE_DOMAIN = "https://sandeepkumarjha.com.np/projects/codersclub/";

    const courses = {
      "oracle-plsql": {
        name: "Mastering Oracle PL/SQL for Financial Systems",
        price: 6500.00,
        imageUrl: "img/python.jpg"
      },
      "banking-etl": {
        name: "Banking Data Reconciliation Pipelines",
        price: 10500.00,
        imageUrl: "img/feature.jpg"
      },
      "java-mastery": {
        name: "Java Mastery Course",
        price: 4500.55,
        imageUrl: "img/java.png"
      }
    };

    window.addEventListener("load", () => {
      const params = new URLSearchParams(window.location.search);
      const courseId = params.get("courseId") || localStorage.getItem("getpay_expected_course") || "oracle-plsql";
      const courseData = courses[courseId] || courses["oracle-plsql"];
      const amount = parseFloat(params.get("amount")) || parseFloat(localStorage.getItem("getpay_expected_amount")) || courseData.price;
      const userEmail = params.get("email") || "zhasandeep7@gmail.com";

      function initGetPay() {
        if (typeof window.GetPay === 'undefined' && typeof window.getpay === 'undefined') {
          setTimeout(initGetPay, 300);
          return;
        }

        const orderInformationUI = localStorage.getItem("getpay_order_ui") || `
          <div style="font-family:Arial;">
            <h3>Order Information</h3>
            <div class="item" style="margin-bottom: 20px;">
              <div class="item" style="display: flex; align-items: center;">
                <img style="max-width: 50px; max-height: 50px; width: 50px; height: 50px; object-fit: cover; border-radius: 6px; margin-right: 10px;" src="${WEBSITE_DOMAIN}${courseData.imageUrl}" alt="image">
                <div>
                  <div style="font-weight: 600; color: #0f172a;">${courseData.name}</div>
                  <div style="color: #2563eb; font-weight: 700; margin-top: 4px;">NPR ${amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                </div>
              </div>
            </div>
          </div>
        `;

        const options = {
          userInfo: {
            name: "Sandeep Kumar Jha",
            email: userEmail,
            state: "Bagmati",
            country: "Nepal",
            zipcode: "44600",
            city: "Kathmandu",
            address: "Maitidevi"
          },
          clientRequestId: "ORD-" + Date.now(),
          papInfo: PAP_INFO,
          oprKey: OPR_KEY,
          insKey: "",
          websiteDomain: "https://sandeepkumarjha.com.np",
          price: amount,
          businessName: courseData.name,
          imageUrl: WEBSITE_DOMAIN + courseData.imageUrl,
          orderInformationUI: orderInformationUI,
          currency: "NPR",
          prefill: { name: true, email: true, state: true, city: true, address: true },
          themeColor: "#5662FF",
          baseUrl: BASE_URL,
          callbackUrl: {
            successUrl: 'https://sandeepkumarjha.com.np/projects/codersclub/success.html',
            failUrl: 'https://sandeepkumarjha.com.np/projects/codersclub/fail.html'
          },
          onSuccess: function (res) {
            window.location.href = 'https://sandeepkumarjha.com.np/projects/codersclub/success.html';
          },
          onError: function (err) {
            console.error("Payment error:", err);
            alert("Payment initialization error. Check credentials or domain.");
          }
        };

        try {
          if (window.getpay && typeof window.getpay.initialize === 'function') {
            window.getpay.initialize(options);
          } else {
            const gp = new GetPay(options);
            if (typeof gp.initialize === 'function') {
              gp.initialize(options);
            } else if (typeof gp.init === 'function') {
              gp.init(options);
            }
          }
        } catch (e) {
          console.error("Initialization exception:", e);
        }
      }

      initGetPay();
    });
  </script>
</body>

</html>
