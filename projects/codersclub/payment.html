<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
  <title>Payment Checkout | getPay</title>

  <!-- Anti-clickjacking per GetPay doc -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
  </script>

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/payment.css">
</head>
<body>

  <main class="payment-page-container">
    <!-- GetPay Checkout Mount Element: must be clean and present in DOM before bundle executes -->
    <div id="checkout"></div>
    <div id="error-box"></div>
  </main>

  <script src="js/getpay-config.js"></script>

  <script>
    (function () {
      const isAft = new URLSearchParams(window.location.search).get('flow') === 'aft';

      if (isAft) {
        // AFT Flow: Matches official reference implementation (https://getpay.finpos.global/v3/ecom-merchant/payment.html)
        // bundle-v1.js automatically runs: new App({ target: document.getElementById("checkout") })
        // It reads the active payment context from sessionStorage initialized by aft.html and renders the card form.
        const bundleScript = document.createElement('script');
        bundleScript.src = (window.GetPayAftConfig && window.GetPayAftConfig.BUNDLE_URL) || 'https://getpay.finpos.global/v3/ecom-merchant/bundle-v1.js';
        document.body.appendChild(bundleScript);

        history.pushState(null, '', window.location.href);
        window.addEventListener('popstate', function () {
          window.location.replace('./aft.html');
        });
      } else {
        // ECOM Flow: Load NCHL v5 bundle, then initialize course checkout via js/payment.js
        const ecomBundle = document.createElement('script');
        ecomBundle.src = (window.GetPayConfig && window.GetPayConfig.BUNDLE_URL) || 'https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js';
        ecomBundle.onload = function () {
          const ctrl = document.createElement('script');
          ctrl.src = 'js/payment.js';
          document.body.appendChild(ctrl);
        };
        ecomBundle.onerror = function () {
          const errBox = document.getElementById('error-box');
          if (errBox) {
            errBox.textContent = 'GetPay SDK failed to load. Check network / AdBlock.';
            errBox.style.display = 'block';
          }
        };
        document.body.appendChild(ecomBundle);
      }
    })();
  </script>
</body>
</html>
