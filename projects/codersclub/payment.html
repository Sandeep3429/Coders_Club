<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
  <title>Payment Checkout | getPay</title>

  <!-- Anti-clickjacking per GetPay doc -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
  </script>

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/payment.css">

  <!-- Centralized Configuration -->
  <script src="js/getpay-config.js"></script>

  <!-- Synchronously load the exact SDK bundle in HEAD for instantaneous parsing -->
  <script>
    (function () {
      const isAft = new URLSearchParams(window.location.search).get('flow') === 'aft';
      const bundleSrc = isAft
        ? ((window.GetPayAftConfig && window.GetPayAftConfig.BUNDLE_URL) || 'https://getpay.finpos.global/v3/ecom-merchant/bundle-v1.js')
        : ((window.GetPayConfig && window.GetPayConfig.BUNDLE_URL) || 'https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js');
      document.write('<script src="' + bundleSrc + '"><\/script>');
    })();
  </script>
</head>
<body>

  <main class="payment-page-container">
    <!-- GetPay Checkout Mount Element per documentation -->
    <div id="checkout">
      <div id="checkout-loader">
        <div class="checkout-spinner"></div>
        <div class="checkout-loader-text">Loading GetPay Secure Checkout&hellip;</div>
      </div>
    </div>
    <div id="error-box"></div>
  </main>

  <!-- Synchronously load the exact controller matching the current flow -->
  <script>
    (function () {
      const isAft = new URLSearchParams(window.location.search).get('flow') === 'aft';
      const ctrlSrc = isAft ? 'js/aft-payment.js' : 'js/payment.js';
      document.write('<script src="' + ctrlSrc + '"><\/script>');
    })();
  </script>
</body>
</html>
