<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
  <title>Payment Checkout | getPay</title>

  <!-- Anti-clickjacking per GetPay doc -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location.href;
    }
  </script>

  <!-- Segregated Stylesheet -->
  <link rel="stylesheet" href="css/payment.css">

  <!--
    Bundle loading strategy:
    - ECOM flow (?flow=ecom or no flow param): load existing NCHL v5 bundle
    - AFT  flow (?flow=aft):                   load GetPay v3 merchant bundle
    Both are loaded via JS below so only one ever executes per page load.
  -->
</head>
<body>

  <main class="payment-page-container">
    <!-- GetPay Checkout Mount Element per documentation -->
    <div id="checkout">
      <div id="checkout-loader">
        <div class="checkout-spinner"></div>
        <div class="checkout-loader-text">Loading GetPay Secure Checkout&hellip;</div>
      </div>
    </div>
    <div id="error-box"></div>
  </main>

  <!-- Centralized config — exposes both GetPayConfig (ECOM) and GetPayAftConfig (AFT) -->
  <script src="js/getpay-config.js"></script>

  <!-- Conditionally load the correct SDK bundle, then the matching controller -->
  <script>
    (function () {
      const isAft = new URLSearchParams(window.location.search).get('flow') === 'aft';
      const bundleSrc = isAft
        ? (window.GetPayAftConfig && window.GetPayAftConfig.BUNDLE_URL)
        : (window.GetPayConfig   && window.GetPayConfig.BUNDLE_URL);

      const s = document.createElement('script');
      s.defer = true;
      s.src   = bundleSrc || 'https://minio-getpay.nchl.com.np/getpay-cdn/webcheckout/v5/bundle.js';
      document.head.appendChild(s);

      // Load the matching controller after the config is ready
      const ctrl = document.createElement('script');
      ctrl.src = isAft ? 'js/aft-payment.js' : 'js/payment.js';
      document.body.appendChild(ctrl);
    })();
  </script>
</body>
</html>
